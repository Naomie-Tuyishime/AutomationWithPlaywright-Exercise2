name: Playwright Java CI

on:
  push:
    branches:
      - "**"   # triggers on ALL branches
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      # 4. INSTALL PLAYWRIGHT (NO manual Linux packages)
      # This avoids ALL errors like libvpx7, libasound2, libffi7, etc.
      - name: Install Playwright browsers (stable way)
        run: |
          mvn -q exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install"

      # 5. Run tests
      - name: Run Maven tests
        run: mvn clean test
