name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - "**"   # run on all branches
  pull_request:
    branches:
      - dev    # PRs targeting dev
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build project
        run: npm run build
